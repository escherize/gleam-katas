project:
  type: book
  output-dir: _book

book:
  title: "DDD in Gleam"
  subtitle: "A textbook in ten katas"
  author: "Bryan Maass"
  date: today
  cover-image: cover.png    # 1200x1800 — used by the PDF title page
  description: "A 10-kata progression that teaches idiomatic Gleam through DDD's vocabulary."
  search: true
  site-url: https://escherize.com/gleam-katas/
  open-graph:
    image: og-image.png     # 1200x630 — used by social cards
    image-width: 1200
    image-height: 630
  twitter-card:
    image: og-image.png
    image-width: 1200
    image-height: 630
    card-style: summary_large_image
  repo-url: https://github.com/escherize/gleam-katas
  repo-branch: solutions
  repo-subdir: docs/book
  repo-actions: [edit, source]

  chapters:
    - index.md
    - 00_introduction.md
    - 01_fundamentals.md
    - 02_kata_email.md
    - 03_kata_money.md
    - 04_kata_customer.md
    - 05_kata_order.md
    - 06_kata_events.md
    - 07_kata_repositories.md
    - 08_kata_bounded_contexts.md
    - 09_kata_http_boundary.md
    - 10_kata_sqlite_repo.md
    - 11_kata_wiring.md
    - 12_in_practice.md

  appendices:
    - use.md

# Chapter titles already carry "01.", "02.", ... so disable Quarto's
# own numbering rather than producing "Chapter 2 — 01. Gleam fundamentals"
# double labels.
number-sections: false

format:
  html:
    theme: cosmo
    code-link: true
    code-copy: true
    toc-depth: 3
  pdf:
    documentclass: scrbook
    include-before-body:
      text: |
        \begin{titlepage}
          \centering
          \vspace*{\fill}
          \includegraphics[width=\textwidth]{cover.png}
          \vspace*{\fill}
        \end{titlepage}
        \cleardoublepage
    geometry:
      - top=28mm
      - left=25mm
      - right=25mm
      - bottom=28mm
      - heightrounded
    fontsize: 11pt
    linestretch: 1.15
    colorlinks: true
    code-block-bg: "#f5f5f5"
    code-block-border-left: "#999999"
    code-overflow: wrap
    highlight-style: github
  # Add epub later when a cover image exists (epub renders blow up
  # on an empty cover-image: "" path).
